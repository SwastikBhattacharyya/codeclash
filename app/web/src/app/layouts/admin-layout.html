<div class="flex min-h-dvh">
  @if (drawerOpen()) {
    <div
      class="fixed inset-0 z-40 bg-board/60 lg:hidden"
      (click)="closeDrawerAndFocusToggle()"
    ></div>
  }

  <aside
    [id]="drawerId"
    class="fixed inset-y-0 left-0 z-50 w-72 max-w-[85vw] flex-col border-r border-line bg-raised shadow-overlay lg:sticky lg:top-0 lg:z-auto lg:flex lg:h-dvh lg:w-60 lg:max-w-none lg:shrink-0 lg:shadow-none"
    [class.flex]="drawerOpen()"
    [class.animate-drawer-in]="drawerOpen()"
    [class.hidden]="!drawerOpen()"
    [attr.role]="drawerOpen() ? 'dialog' : null"
    [attr.aria-modal]="drawerOpen() ? 'true' : null"
    [attr.aria-label]="drawerOpen() ? 'Admin navigation' : null"
  >
    <div class="flex min-h-16 items-center justify-between gap-2 border-b border-line px-3 lg:px-5">
      <div class="flex min-w-0 items-baseline gap-2 pl-1 lg:pl-0">
        <cc-wordmark />
        <span class="text-xs font-semibold tracking-widest text-ink-muted uppercase">Admin</span>
      </div>
      <button
        #drawerClose
        type="button"
        class="inline-flex size-11 cursor-pointer items-center justify-center rounded-control text-ink hover:bg-ink/6 lg:hidden"
        aria-label="Close menu"
        (click)="closeDrawerAndFocusToggle()"
      >
        <svg lucideX class="size-5"></svg>
      </button>
    </div>

    <nav aria-label="Admin" class="flex-1 overflow-y-auto px-3 py-4">
      <a
        [routerLink]="adminPath"
        [attr.aria-current]="overviewActive() ? 'page' : null"
        class="flex min-h-11 items-center gap-3 rounded-chip border-l-2 border-transparent px-3 text-sm font-medium text-ink-muted transition-colors hover:bg-ink/6 hover:text-ink aria-[current=page]:border-accent aria-[current=page]:bg-ink/6 aria-[current=page]:text-ink lg:min-h-10"
      >
        <svg lucideLayoutDashboard class="size-4 shrink-0"></svg>
        {{ overviewLabel }}
      </a>

      @for (group of groups(); track group.label) {
        <p
          [id]="drawerId + '-' + group.label"
          class="mt-6 mb-2 px-3 text-xs font-semibold tracking-widest text-ink-muted uppercase"
        >
          {{ group.label }}
        </p>
        <ul class="flex flex-col gap-0.5" [attr.aria-labelledby]="drawerId + '-' + group.label">
          @for (section of group.sections; track section.key) {
            @let active = isActive(section);
            <li>
              <a
                [routerLink]="section.path"
                [attr.aria-current]="active ? 'page' : null"
                class="flex min-h-11 items-center gap-3 rounded-chip border-l-2 border-transparent px-3 text-sm font-medium text-ink-muted transition-colors hover:bg-ink/6 hover:text-ink aria-[current=page]:border-accent aria-[current=page]:bg-ink/6 aria-[current=page]:text-ink lg:min-h-10"
              >
                <cc-admin-section-icon [section]="section.key" class="size-4" />
                {{ section.label }}
              </a>
            </li>
          }
        </ul>
      }
    </nav>

    <div class="flex flex-col gap-3 border-t border-line p-3">
      <cc-theme-toggle class="md:hidden" />
      <a
        [routerLink]="sitePath"
        class="flex min-h-11 items-center gap-3 rounded-chip px-3 text-sm font-medium text-ink-muted transition-colors hover:bg-ink/6 hover:text-ink lg:min-h-10"
      >
        <svg lucideArrowLeft class="size-4 shrink-0"></svg>
        Back to site
      </a>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col" [attr.inert]="drawerOpen() ? '' : null">
    <header class="sticky top-0 z-30 border-b border-line bg-raised">
      <div class="mx-auto flex min-h-16 w-full max-w-6xl items-center gap-3 px-4 py-2 sm:px-8">
        <button
          #drawerToggle
          type="button"
          class="inline-flex size-11 cursor-pointer items-center justify-center rounded-control border border-control bg-raised text-ink lg:hidden"
          [attr.aria-expanded]="drawerOpen()"
          [attr.aria-controls]="drawerId"
          aria-label="Admin menu"
          (click)="openDrawer()"
        >
          <svg lucideMenu class="size-5"></svg>
        </button>
        <p class="flex min-w-0 items-center gap-2 text-sm">
          <span class="text-ink-muted">Admin</span>
          <span class="text-ink-muted" aria-hidden="true">/</span>
          <span class="truncate font-medium text-ink">{{ currentLabel() }}</span>
        </p>
        <div class="ml-auto flex items-center gap-2 sm:gap-3">
          <cc-theme-toggle class="hidden md:block" />
          <cc-user-menu />
        </div>
      </div>
    </header>

    <main
      #content
      tabindex="-1"
      class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 outline-none sm:px-8 sm:py-12"
    >
      <router-outlet />
    </main>
  </div>
</div>
