<fieldset class="inline-flex rounded-control border border-control bg-raised p-0.5">
  <legend class="sr-only">Color theme</legend>
  @for (option of options; track option.value) {
    <label
      [title]="option.label"
      class="inline-flex size-11 cursor-pointer items-center justify-center rounded-chip text-ink-muted transition-colors hover:text-ink has-checked:bg-ink has-checked:text-surface has-focus-visible:shadow-[0_0_0_2px_var(--color-accent)] has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-ink sm:size-9"
    >
      <input
        type="radio"
        [name]="groupName"
        class="sr-only"
        [value]="option.value"
        [checked]="store.preference() === option.value"
        (change)="store.set(option.value)"
      />
      @switch (option.value) {
        @case ('system') {
          <svg lucideMonitor class="size-5 sm:size-4"></svg>
        }
        @case ('light') {
          <svg lucideSun class="size-5 sm:size-4"></svg>
        }
        @case ('dark') {
          <svg lucideMoon class="size-5 sm:size-4"></svg>
        }
      }
      <span class="sr-only">{{ option.label }}</span>
    </label>
  }
</fieldset>
