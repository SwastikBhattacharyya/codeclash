<button
  #trigger
  type="button"
  class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-control border border-control bg-raised px-3 text-sm font-medium text-ink transition-colors hover:border-ink-muted sm:min-h-10"
  [attr.aria-controls]="open() ? menuId : null"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <svg lucideCircleUser class="size-5"></svg>
  <span class="sr-only sm:not-sr-only">Account</span>
  <svg
    lucideChevronDown
    class="hidden size-4 text-ink-muted transition-transform sm:block"
    [class.rotate-180]="open()"
  ></svg>
</button>
@if (open()) {
  <div
    [id]="menuId"
    class="absolute top-full right-0 z-40 mt-2 w-56 animate-menu-in rounded-control border border-line bg-raised p-1 shadow-overlay"
  >
    <ul class="flex flex-col">
      <li>
        <a
          [routerLink]="profilePath"
          (click)="closeAfterNavigation()"
          class="flex min-h-11 items-center gap-3 rounded-chip px-3 text-sm text-ink hover:bg-ink/6"
        >
          <svg lucideUser class="size-4 text-ink-muted"></svg>
          Profile
        </a>
      </li>
      <li>
        <a
          [routerLink]="changePasswordPath"
          (click)="closeAfterNavigation()"
          class="flex min-h-11 items-center gap-3 rounded-chip px-3 text-sm text-ink hover:bg-ink/6"
        >
          <svg lucideKeyRound class="size-4 text-ink-muted"></svg>
          Change password
        </a>
      </li>
      @if (isAdmin()) {
        <li>
          <a
            [routerLink]="adminPath"
            (click)="closeAfterNavigation()"
            class="flex min-h-11 items-center gap-3 rounded-chip px-3 text-sm text-ink hover:bg-ink/6"
          >
            <svg lucideShield class="size-4 text-ink-muted"></svg>
            Admin
          </a>
        </li>
      }
      <li class="mt-1 border-t border-line pt-1">
        <button
          type="button"
          class="flex min-h-11 w-full cursor-pointer items-center gap-3 rounded-chip px-3 text-left text-sm text-ink hover:bg-ink/6 disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="signingOut()"
          (click)="signOut()"
        >
          <svg lucideLogOut class="size-4 text-ink-muted"></svg>
          Sign out
        </button>
      </li>
    </ul>
  </div>
}
