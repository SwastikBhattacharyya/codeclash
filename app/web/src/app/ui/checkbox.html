<label
  class="inline-flex min-h-11 cursor-pointer items-center gap-3 text-base text-ink has-disabled:cursor-not-allowed has-disabled:opacity-60"
>
  <span class="relative inline-flex size-5 shrink-0">
    <input
      #control
      type="checkbox"
      [checked]="checked()"
      [disabled]="disabled()"
      [attr.name]="name() || null"
      (change)="onChange($event)"
      (blur)="touch.emit()"
      class="peer size-5 cursor-pointer appearance-none rounded-chip border border-ink-muted bg-raised transition-colors checked:border-ink checked:bg-accent disabled:cursor-not-allowed"
    />
    <svg
      lucideCheck
      class="pointer-events-none absolute inset-0 m-auto size-4 text-on-accent opacity-0 peer-checked:opacity-100"
      [strokeWidth]="3"
    ></svg>
  </span>
  <span>{{ label() }}</span>
</label>
