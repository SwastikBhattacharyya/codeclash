<div>
  <div class="mb-1.5 flex flex-wrap items-end justify-between gap-2">
    <label [for]="id" class="block text-sm font-medium text-ink">{{ label() }}</label>
    <ng-content select="[ccCodeAreaAction]" />
  </div>
  <textarea
    #control
    [id]="id"
    [rows]="rows()"
    [value]="value()"
    [attr.name]="name() || null"
    [attr.aria-invalid]="showError() || null"
    [attr.aria-describedby]="describedBy()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [required]="required()"
    spellcheck="false"
    autocapitalize="none"
    autocomplete="off"
    wrap="off"
    (input)="onInput($event)"
    (blur)="touch.emit()"
    class="block w-full resize-y rounded-control border border-control bg-raised px-3 py-2.5 font-mono text-sm text-ink transition-colors hover:border-ink-muted focus-visible:border-ink disabled:cursor-not-allowed disabled:opacity-60 aria-invalid:border-danger"
  ></textarea>
  <div class="mt-1.5 flex items-start justify-between gap-3">
    <div class="min-w-0 flex-1">
      @if (hint()) {
        <p [id]="hintId" class="text-sm text-ink-muted">{{ hint() }}</p>
      }
      <div [id]="errorId" aria-live="polite">
        @if (showError()) {
          <p class="text-sm text-danger">{{ errorMessage() }}</p>
        }
      </div>
    </div>
    @if (limit() !== null) {
      <p
        [id]="counterId"
        class="shrink-0 text-sm tabular-nums"
        [class.text-ink-muted]="!overLimit()"
        [class.text-danger]="overLimit()"
      >
        {{ length() }} / {{ limit() }}
      </p>
    }
  </div>
</div>
