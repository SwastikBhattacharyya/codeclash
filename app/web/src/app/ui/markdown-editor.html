<div>
  <div class="mb-1.5 flex flex-wrap items-end justify-between gap-3">
    <span [id]="labelId" class="text-sm font-medium text-ink">{{ label() }}</span>
    <div
      role="tablist"
      [attr.aria-labelledby]="labelId"
      class="inline-flex rounded-control border border-line bg-surface p-0.5"
    >
      <button
        type="button"
        role="tab"
        [id]="writeTabId"
        [attr.aria-selected]="tab() === 'write'"
        [attr.aria-controls]="writePanelId"
        [attr.tabindex]="tab() === 'write' ? 0 : -1"
        (click)="select('write')"
        (keydown)="onTabKey($event)"
        class="cursor-pointer rounded-chip px-3 py-1 text-sm transition-colors"
        [class.bg-raised]="tab() === 'write'"
        [class.shadow-sm]="tab() === 'write'"
        [class.ring-1]="tab() === 'write'"
        [class.ring-control]="tab() === 'write'"
        [class.text-ink]="tab() === 'write'"
        [class.font-medium]="tab() === 'write'"
        [class.text-ink-muted]="tab() !== 'write'"
      >
        Write
      </button>
      <button
        type="button"
        role="tab"
        [id]="previewTabId"
        [attr.aria-selected]="tab() === 'preview'"
        [attr.aria-controls]="previewPanelId"
        [attr.tabindex]="tab() === 'preview' ? 0 : -1"
        (click)="select('preview')"
        (keydown)="onTabKey($event)"
        class="cursor-pointer rounded-chip px-3 py-1 text-sm transition-colors"
        [class.bg-raised]="tab() === 'preview'"
        [class.shadow-sm]="tab() === 'preview'"
        [class.ring-1]="tab() === 'preview'"
        [class.ring-control]="tab() === 'preview'"
        [class.text-ink]="tab() === 'preview'"
        [class.font-medium]="tab() === 'preview'"
        [class.text-ink-muted]="tab() !== 'preview'"
      >
        Preview
      </button>
    </div>
  </div>

  <div
    role="tabpanel"
    [id]="writePanelId"
    [attr.aria-labelledby]="writeTabId"
    [hidden]="tab() !== 'write'"
  >
    <textarea
      #control
      [id]="id"
      [rows]="rows()"
      [value]="value()"
      [attr.name]="name() || null"
      [attr.aria-labelledby]="labelId"
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="describedBy()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [required]="required()"
      spellcheck="true"
      (input)="onInput($event)"
      (blur)="touch.emit()"
      class="block w-full resize-y rounded-control border border-control bg-raised px-3 py-2.5 font-mono text-sm text-ink transition-colors placeholder:text-ink-muted hover:border-ink-muted focus-visible:border-ink disabled:cursor-not-allowed disabled:opacity-60 aria-invalid:border-danger"
    ></textarea>
  </div>

  <div
    role="tabpanel"
    tabindex="0"
    [id]="previewPanelId"
    [attr.aria-labelledby]="previewTabId"
    [hidden]="tab() !== 'preview'"
    class="min-h-40 rounded-control border border-line bg-raised px-4 py-3"
  >
    @if (tab() === 'preview') {
      @if (value().trim() === '') {
        <p class="text-ink-muted">Nothing to preview yet.</p>
      } @else {
        <cc-markdown [source]="value()" />
      }
    }
  </div>

  <div class="mt-1.5 flex items-start justify-between gap-3">
    <div class="min-w-0 flex-1">
      @if (hint()) {
        <p [id]="hintId" class="text-sm text-ink-muted">{{ hint() }}</p>
      }
      <div [id]="errorId" aria-live="polite">
        @if (showError()) {
          <p class="text-sm text-danger">{{ errorMessage() }}</p>
        }
      </div>
    </div>
    @if (limit() !== null) {
      <p
        [id]="counterId"
        class="shrink-0 text-sm tabular-nums"
        [class.text-ink-muted]="!overLimit()"
        [class.text-danger]="overLimit()"
      >
        {{ length() }} / {{ limit() }}
      </p>
    }
  </div>
</div>
