<div>
  <label [for]="id" class="mb-1.5 block text-sm font-medium text-ink">{{ label() }}</label>
  <div class="relative">
    <input
      #control
      [id]="id"
      [type]="revealed() ? 'text' : 'password'"
      [value]="value()"
      [attr.name]="name() || null"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="describedBy()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [required]="required()"
      (input)="onInput($event)"
      (blur)="touch.emit()"
      autocapitalize="off"
      spellcheck="false"
      class="min-h-11 w-full rounded-control border border-control bg-raised py-2 pr-12 pl-3 text-base text-ink transition-colors hover:border-ink-muted focus-visible:border-ink disabled:cursor-not-allowed disabled:opacity-60 aria-invalid:border-danger"
    />
    <button
      type="button"
      class="absolute inset-y-0 right-0 inline-flex w-11 cursor-pointer items-center justify-center rounded-r-control text-ink-muted hover:text-ink"
      [attr.aria-label]="'Show ' + label().toLowerCase()"
      [attr.aria-pressed]="revealed()"
      [attr.aria-controls]="id"
      [disabled]="disabled()"
      (click)="toggleReveal()"
    >
      @if (revealed()) {
        <svg lucideEyeOff class="size-5"></svg>
      } @else {
        <svg lucideEye class="size-5"></svg>
      }
    </button>
  </div>
  @if (hint()) {
    <p [id]="hintId" class="mt-1.5 text-sm text-ink-muted">{{ hint() }}</p>
  }
  @if (ruleStates().length > 0) {
    <ul [id]="rulesId" class="mt-2 grid gap-1 text-sm sm:grid-cols-2">
      @for (rule of ruleStates(); track $index) {
        <li
          class="flex items-center gap-2"
          [class.text-success]="rule.met"
          [class.text-ink-muted]="!rule.met"
        >
          @if (rule.met) {
            <svg lucideCheck class="size-4 shrink-0"></svg>
          } @else {
            <svg lucideCircle class="size-4 shrink-0"></svg>
          }
          <span
            >{{ rule.label
            }}<span class="sr-only">{{ rule.met ? ', met' : ', not met' }}</span></span
          >
        </li>
      }
    </ul>
  }
  <div [id]="errorId" aria-live="polite">
    @if (showError()) {
      <p class="mt-1.5 text-sm text-danger">{{ errorMessage() }}</p>
    }
  </div>
</div>
