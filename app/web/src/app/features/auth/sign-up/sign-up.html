<cc-panel class="sm:border-0 sm:bg-transparent sm:p-0">
  <h1 class="text-3xl text-ink sm:text-4xl">Create your account</h1>
  <p class="mt-3 text-ink-muted">
    Already have an account?
    <a
      [routerLink]="signInPath"
      class="rounded-chip font-semibold text-ink underline underline-offset-4 hover:no-underline"
      >Sign in</a
    >
  </p>
  @if (formError(); as message) {
    <cc-alert tone="error" class="mt-6">{{ message }}</cc-alert>
  }

  <form [formRoot]="signUpForm" class="mt-8 flex flex-col gap-5">
    <cc-text-field [formField]="signUpForm.name" label="Name" autocomplete="name" />
    <cc-text-field
      autocapitalize="none"
      [spellcheck]="false"
      [formField]="signUpForm.username"
      label="Username"
      hint="Letters, numbers, _ and -. Others see this on leaderboards."
      autocomplete="username"
    />
    <cc-text-field
      autocapitalize="none"
      [spellcheck]="false"
      [formField]="signUpForm.email"
      label="Email"
      type="email"
      autocomplete="email"
    />
    <cc-password-field
      [formField]="signUpForm.password"
      label="Password"
      autocomplete="new-password"
      [rules]="passwordRules"
    />
    <button ccButton type="submit" class="mt-2 w-full" [loading]="signUpForm().submitting()">
      Create account
    </button>
  </form>

  <p class="mt-6 text-sm text-ink-muted">
    Have a verification code?
    <a
      [routerLink]="verifyEmailPath"
      class="rounded-chip font-semibold text-ink underline underline-offset-4 hover:no-underline"
      >Verify your email</a
    >
  </p>
</cc-panel>
