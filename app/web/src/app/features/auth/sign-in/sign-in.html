<cc-panel class="sm:border-0 sm:bg-transparent sm:p-0">
  <h1 class="text-3xl text-ink sm:text-4xl">Sign in</h1>
  <p class="mt-3 text-ink-muted">
    New to CodeClash?
    <a
      [routerLink]="signUpPath"
      class="rounded-chip font-semibold text-ink underline underline-offset-4 hover:no-underline"
      >Create an account</a
    >
  </p>

  @if (justVerified) {
    <cc-alert tone="success" class="mt-6">Your email is verified. Sign in to continue.</cc-alert>
  }
  @if (formError(); as message) {
    <cc-alert tone="error" class="mt-6">{{ message }}</cc-alert>
  }

  <form [formRoot]="signInForm" class="mt-8 flex flex-col gap-5">
    <cc-text-field
      autocapitalize="none"
      [spellcheck]="false"
      [formField]="signInForm.login"
      label="Email or username"
      autocomplete="username"
    />
    <cc-password-field
      [formField]="signInForm.password"
      label="Password"
      autocomplete="current-password"
    />
    <cc-checkbox [formField]="signInForm.rememberMe" label="Keep me signed in on this device" />
    <button ccButton type="submit" class="w-full" [loading]="signInForm().submitting()">
      Sign in
    </button>
  </form>

  <p class="mt-6 text-sm text-ink-muted">
    Have a verification code?
    <a
      [routerLink]="verifyEmailPath"
      class="rounded-chip font-semibold text-ink underline underline-offset-4 hover:no-underline"
      >Verify your email</a
    >
  </p>
</cc-panel>
