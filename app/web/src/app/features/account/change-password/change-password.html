<div class="max-w-2xl">
  <h1 class="text-3xl text-ink sm:text-4xl">Change password</h1>
  <p class="mt-2 text-ink-muted">
    After the change, you stay signed in here and every other device is signed out.
  </p>

  <cc-panel class="mt-8">
    @if (formError(); as message) {
      <cc-alert tone="error" class="mb-6">{{ message }}</cc-alert>
    }
    <form [formRoot]="passwordForm" class="flex max-w-md flex-col gap-5">
      <cc-password-field
        [formField]="passwordForm.currentPassword"
        label="Current password"
        autocomplete="current-password"
      />
      <cc-password-field
        [formField]="passwordForm.newPassword"
        label="New password"
        autocomplete="new-password"
        [rules]="passwordRules"
      />
      <cc-password-field
        [formField]="passwordForm.confirmPassword"
        label="Repeat new password"
        autocomplete="new-password"
      />
      <div class="flex flex-wrap gap-3">
        <button ccButton type="submit" [loading]="passwordForm().submitting()">
          Change password
        </button>
        <a ccButton variant="ghost" [routerLink]="profilePath">Cancel</a>
      </div>
    </form>
  </cc-panel>
</div>
