server:
  forward-headers-strategy: framework

spring:
  application:
    name: problem-service
  kafka:
    consumer:
      group-id: ${spring.application.name}
      properties:
        allow.auto.create.topics: false
    producer:
      compression-type: zstd
      properties:
        max.request.size: 16777216
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  mvc:
    apiversion:
      use:
        path-segment: 1
      supported: 1
      detect-supported: false
  threads:
    virtual:
      enabled: true

logging:
  level:
    org.apache.kafka: warn
    org.springframework.kafka.listener.KafkaMessageListenerContainer: warn

jdbc:
  includes: query

management:
  observations:
    annotations:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  default-produces-media-type: application/json

codeclash:
  openapi:
    title: Problem Service
    description: Questions, categories, tags, test cases and submissions
  auth:
    connect-timeout: 1s
    read-timeout: 2s
  contest:
    cdc-consumer:
      topic: contest.contest.cdc
      retry:
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 30s
  question:
    cdc-topic:
      name: problem.question.cdc
      partitions: 3
  submission:
    cdc-topic:
      name: problem.submission.cdc
      partitions: 3
    state-consumer:
      topic: runner.submission.state
      retry:
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 30s
  test-case:
    cdc-topic:
      name: problem.test-case.cdc
      partitions: 3
    cdc-topic-max-message-size: 16MB
  user:
    cdc-consumer:
      topic: auth.user.cdc
      concurrency: 3
      retry:
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 30s

namastack:
  outbox:
    jdbc:
      table-names:
        record: outbox_records
        instance: outbox_instances
        partition: outbox_partitions
      schema-initialization:
        enabled: false
