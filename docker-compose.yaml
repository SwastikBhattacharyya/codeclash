name: codeclash

services:
  db:
    image: postgres:18.6-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    container_name: ${COMPOSE_PROJECT_NAME}_redpanda
    restart: unless-stopped
    networks:
      - codeclash
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:${REDPANDA_PORT}
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${REDPANDA_PORT}:9092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: ${COMPOSE_PROJECT_NAME}_mailpit
    restart: unless-stopped
    networks:
      - codeclash
    ports:
      - "${MAIL_SMTP_PORT}:1025"
      - "${MAIL_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/otel-lgtm:0.34.0
    container_name: ${COMPOSE_PROJECT_NAME}_grafana
    restart: unless-stopped
    networks:
      - codeclash
    ports:
      - "${GRAFANA_PORT}:3000"
      - "${OTLP_GRPC_PORT}:4317"
      - "${OTLP_HTTP_PORT}:4318"
    volumes:
      - grafana_data:/data
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  codeclash:
    name: ${COMPOSE_PROJECT_NAME}_network

volumes:
  db_data:
    name: ${COMPOSE_PROJECT_NAME}_db_data
  redpanda_data:
    name: ${COMPOSE_PROJECT_NAME}_redpanda_data
  grafana_data:
    name: ${COMPOSE_PROJECT_NAME}_grafana_data
