apiVersion: v1
kind: Service
metadata:
  name: ${DB_SERVICE}-db
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${DB_SERVICE}-db
    app.kubernetes.io/part-of: codeclash
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ${DB_SERVICE}-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${DB_SERVICE}-db
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ${DB_SERVICE}-db
    app.kubernetes.io/part-of: codeclash
spec:
  serviceName: ${DB_SERVICE}-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${DB_SERVICE}-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${DB_SERVICE}-db
        app.kubernetes.io/part-of: codeclash
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - name: POSTGRES_DB
              value: ${DB_SERVICE}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ${DB_SERVICE}-db-local
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${DB_SERVICE}-db-local
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: ${POSTGRES_STORAGE}
