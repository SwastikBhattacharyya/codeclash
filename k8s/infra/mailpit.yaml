apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: codeclash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: codeclash
      annotations:
        codeclash.dev/config-hash: "${OPS_HASH}"
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.6
          env:
            - name: MP_UI_AUTH
              valueFrom:
                secretKeyRef:
                  name: ops
                  key: ui-auth
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          readinessProbe:
            exec:
              command: ["/mailpit", "readyz"]
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: codeclash
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
