apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: codeclash
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: redpanda
    app.kubernetes.io/part-of: codeclash
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
        app.kubernetes.io/part-of: codeclash
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.6
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=$(POD_IP):33145
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
            - name: rpc
              containerPort: 33145
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -E 'Healthy:.+true'"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
