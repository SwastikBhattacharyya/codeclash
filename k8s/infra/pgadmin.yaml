apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: codeclash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgadmin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgadmin
        app.kubernetes.io/part-of: codeclash
      annotations:
        codeclash.dev/config-hash: "${PGADMIN_CONFIG_HASH}"
    spec:
      securityContext:
        fsGroup: 5050
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.19.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p "$PGPASS_DIR"
              cp /secrets/pgpass "$PGPASS_DIR/pgpass"
              chmod 600 "$PGPASS_DIR/pgpass"
              exec /entrypoint.sh
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ops
                  key: username
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ops
                  key: password
            - name: PGADMIN_LISTEN_PORT
              value: "8080"
            - name: PGADMIN_SERVER_JSON_FILE
              value: /config/servers.json
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
            - name: PGADMIN_DISABLE_POSTFIX
              value: "True"
            - name: PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS
              value: "['local', 'localhost', 'test', 'example', 'invalid', 'internal', 'lan', 'home']"
            - name: PGADMIN_CONFIG_GLOBALLY_DELIVERABLE
              value: "False"
            - name: PGPASS_DIR
              value: "${PGADMIN_STORAGE_DIR}"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin
            - name: servers
              mountPath: /config
              readOnly: true
            - name: pgpass
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: servers
          configMap:
            name: pgadmin-servers
        - name: pgpass
          secret:
            secretName: pgadmin-pgpass
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/part-of: codeclash
spec:
  selector:
    app.kubernetes.io/name: pgadmin
  ports:
    - name: http
      port: 8080
      targetPort: http
