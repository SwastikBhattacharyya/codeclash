apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: codeclash
data:
  API_URL: "http://gateway-service:8080"
  NG_ALLOWED_HOSTS: "${WEB_ALLOWED_HOSTS}"
  NG_TRUST_PROXY_HEADERS: "x-forwarded-proto,x-forwarded-port,x-forwarded-for"
  TRUST_PROXY: "loopback, linklocal, uniquelocal"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: codeclash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: codeclash
      annotations:
        codeclash.dev/deploy-id: "${DEPLOY_ID}"
    spec:
      containers:
        - name: web
          image: ${IMAGE_PREFIX}web:${IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          envFrom:
            - configMapRef:
                name: web-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: ${WEB_MEMORY_LIMIT}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: codeclash
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
