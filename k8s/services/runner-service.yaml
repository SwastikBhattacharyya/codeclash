apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-service-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: runner-service
    app.kubernetes.io/part-of: codeclash
data:
  SPRING_DATASOURCE_URL: "${RUNNER_DB_URL}"
  DOCKER_HOST: "tcp://localhost:2375"
  CODECLASH_SANDBOX_IMAGE: "codeclash-runner:local"
  CODECLASH_SANDBOX_WARMSIZE: "${RUNNER_WARM_SIZE}"
  CODECLASH_SANDBOX_MEMORY: "${SANDBOX_MEMORY}"
  CODECLASH_SUBMISSION_WORKER_MAXCONCURRENT: "${RUNNER_MAX_CONCURRENT}"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "${OTLP_ENDPOINT}/v1/metrics"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "${OTLP_ENDPOINT}/v1/traces"
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: "${OTLP_ENDPOINT}/v1/logs"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-service
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: runner-service
    app.kubernetes.io/part-of: codeclash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-service
        app.kubernetes.io/part-of: codeclash
      annotations:
        codeclash.dev/deploy-id: "${DEPLOY_ID}"
    spec:
      initContainers:
        - name: dind
          image: docker:29.9.3-dind
          restartPolicy: Always
          args: ["dockerd", "--host=unix:///var/run/docker.sock", "--host=tcp://127.0.0.1:2375", "--tls=false"]
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          startupProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: ${DIND_MEMORY_LIMIT}
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
        - name: sandbox-load
          image: ${IMAGE_PREFIX}sandbox-bundle:${IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          command: ["docker", "load", "-i", "/sandbox.tar"]
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2375
      containers:
        - name: runner-service
          image: ${IMAGE_PREFIX}runner-service:${IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          envFrom:
            - configMapRef:
                name: runner-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: runner-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runner-db
                  key: password
          livenessProbe:
            exec:
              command: ["docker", "info", "--format", "{{.ServerVersion}}"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: ${SERVICE_MEMORY_LIMIT}
      volumes:
        - name: docker-data
          emptyDir: {}
