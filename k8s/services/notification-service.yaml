apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: codeclash
data:
  SPRING_DATASOURCE_URL: "${NOTIFICATION_DB_URL}"
  SPRING_MAIL_HOST: "${SMTP_HOST}"
  SPRING_MAIL_PORT: "${SMTP_PORT}"
  SPRING_MAIL_PROTOCOL: "smtp"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: "${SMTP_SSL}"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "${SMTP_AUTH}"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "${SMTP_STARTTLS}"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "${SMTP_STARTTLS}"
  CODECLASH_USER_VERIFICATIONMAIL_FROM: "${MAIL_FROM}"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "${OTLP_ENDPOINT}/v1/metrics"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "${OTLP_ENDPOINT}/v1/traces"
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: "${OTLP_ENDPOINT}/v1/logs"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: codeclash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: codeclash
      annotations:
        codeclash.dev/deploy-id: "${DEPLOY_ID}"
    spec:
      containers:
        - name: notification-service
          image: ${IMAGE_PREFIX}notification-service:${IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          envFrom:
            - configMapRef:
                name: notification-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: password
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: username
                  optional: true
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: password
                  optional: true
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: ${SERVICE_MEMORY_LIMIT}
