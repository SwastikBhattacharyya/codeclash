apiVersion: v1
kind: ConfigMap
metadata:
  name: contest-service-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: contest-service
    app.kubernetes.io/part-of: codeclash
data:
  SPRING_DATASOURCE_URL: "${CONTEST_DB_URL}"
  CODECLASH_AUTH_BASE_URL: "http://auth-service:8080"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "redpanda:9092"
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "${OTLP_ENDPOINT}/v1/metrics"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "${OTLP_ENDPOINT}/v1/traces"
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: "${OTLP_ENDPOINT}/v1/logs"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING}"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contest-service
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: contest-service
    app.kubernetes.io/part-of: codeclash
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: contest-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: contest-service
        app.kubernetes.io/part-of: codeclash
      annotations:
        codeclash.dev/deploy-id: "${DEPLOY_ID}"
    spec:
      containers:
        - name: contest-service
          image: ${IMAGE_PREFIX}contest-service:${IMAGE_TAG}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          envFrom:
            - configMapRef:
                name: contest-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: contest-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: contest-db
                  key: password
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: ${SERVICE_MEMORY_LIMIT}
---
apiVersion: v1
kind: Service
metadata:
  name: contest-service
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: contest-service
    app.kubernetes.io/part-of: codeclash
spec:
  selector:
    app.kubernetes.io/name: contest-service
  ports:
    - name: http
      port: 8080
      targetPort: http
