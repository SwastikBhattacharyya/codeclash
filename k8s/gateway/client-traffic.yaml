apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: codeclash
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: codeclash
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: codeclash
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: ${TRUSTED_PROXY_HOPS}
