[versions]
spring-boot = "4.1.2"
spring-cloud = "2025.1.4"
spring-modulith = "2.1.1"

bouncycastle = "1.86"
datasource-micrometer = "2.3.0"
flyway = "12.4.0"
freefair-lombok = "9.8.3"
jackson-databind-nullable = "0.2.10"
namastack-outbox = "1.11.0"
opentelemetry-logback-appender = "2.28.1-alpha"
springdoc = "3.2.0"

[libraries]
spring-boot = { module = "org.springframework.boot:spring-boot" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-aspectj = { module = "org.springframework.boot:spring-boot-starter-aspectj" }
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway-server-webmvc = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }

bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
datasource-micrometer-bom ={ module = "net.ttddyy.observation:datasource-micrometer-bom", version.ref = "datasource-micrometer" }
datasource-micrometer-opentelemetry = { module = "net.ttddyy.observation:datasource-micrometer-opentelemetry" }
datasource-micrometer-spring-boot = { module = "net.ttddyy.observation:datasource-micrometer-spring-boot" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
micrometer-observation = { module = "io.micrometer:micrometer-observation" }
micrometer-registry-otlp = { module = "io.micrometer:micrometer-registry-otlp" }
namastack-outbox-api = { module = "io.namastack:namastack-outbox-api" }
namastack-outbox-bom = { module = "io.namastack:namastack-outbox-bom", version.ref = "namastack-outbox" }
namastack-outbox-kafka = { module = "io.namastack:namastack-outbox-kafka" }
namastack-outbox-observability = { module = "io.namastack:namastack-outbox-observability" }
namastack-outbox-starter-jdbc = { module = "io.namastack:namastack-outbox-starter-jdbc" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }
postgresql = { module = "org.postgresql:postgresql" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
freefair-lombok = { id = "io.freefair.lombok", version.ref = "freefair-lombok" }
